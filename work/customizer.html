<section id="customizer" class="customizer" aria-label="Character customisation" hidden>
<div class="custom-header"><div><div class="custom-kicker">NOSTRAVECTOR / CREW REGISTRY</div><h2>CREATE YOUR WANDERER</h2></div><button id="customBack" class="custom-link">RETURN TO MENU ↗</button></div>
<div class="custom-content">
<div class="character-preview"><div class="preview-grid" aria-hidden="true"></div><div class="preview-ring" aria-hidden="true"></div><canvas id="characterCanvas" aria-label="Live 3D preview of your customised Wanderer. Drag to turn the character."></canvas><div class="preview-toolbar"><div role="group" aria-label="Preview camera"><button id="faceView" aria-pressed="true">FACE</button><button id="suitView" aria-pressed="false">FULL SUIT</button></div><button id="helmetView" aria-pressed="false">HELMET OFF</button></div><div class="preview-subject"><span>SUBJECT NV-01</span><h3 id="previewName">THE WANDERER</h3><p>DRAG TO ROTATE · SCROLL TO ZOOM</p></div><p id="customError" class="custom-error" role="status"></p></div>
<form id="characterForm" class="character-controls">
<div class="control-section"><div class="section-label"><span>01</span> IDENTITY</div><label class="field-label" for="wandererName">Wanderer name</label><input id="wandererName" type="text" maxlength="24" value="The Wanderer" autocomplete="off" placeholder="Give your Wanderer a name"><fieldset class="gender-options"><legend>Gender</legend><label><input type="radio" name="gender" value="male" checked><span>Male</span></label><label><input type="radio" name="gender" value="female"><span>Female</span></label><label><input type="radio" name="gender" value="nonbinary"><span>Non-binary</span></label></fieldset></div>
<div class="custom-tabs" role="tablist" aria-label="Customisation category"><button id="appearanceTab" role="tab" aria-selected="true" aria-controls="appearancePanel" type="button">02 / APPEARANCE</button><button id="spacesuitTab" role="tab" aria-selected="false" aria-controls="spacesuitPanel" type="button">03 / SPACESUIT</button></div>
<div id="appearancePanel" role="tabpanel" aria-labelledby="appearanceTab">
<div class="field-grid"><label>Hair style<select id="hairStyle"><option value="cropped">Cropped</option><option value="swept" selected>Side swept</option><option value="curly">Curly</option><option value="bob">Bob</option><option value="ponytail">Ponytail</option><option value="bald">Bald</option></select></label><label>Hair colour<input id="hairColor" type="color" value="#2b211e"></label>
<label>Eyes<select id="eyeStyle"><option value="relaxed">Relaxed</option><option value="round" selected>Round</option><option value="focused">Focused</option></select></label><label>Eye colour<input id="eyeColor" type="color" value="#699799"></label>
<label>Mouth<select id="mouthStyle"><option value="neutral">Neutral</option><option value="smile" selected>Smile</option><option value="grin">Grin</option></select></label><label>Ears<select id="earStyle"><option value="rounded">Rounded</option><option value="small">Small</option><option value="pointed">Pointed</option></select></label></div>
<div class="skin-control"><div class="field-label">Skin tone</div><div id="skinChoices" class="skin-choices" role="group" aria-label="Skin tone"><button type="button" data-skin="#f3cfb0" style="--skin:#f3cfb0" aria-label="Light skin" aria-pressed="false"></button><button type="button" data-skin="#dbab82" style="--skin:#dbab82" aria-label="Warm skin" aria-pressed="true"></button><button type="button" data-skin="#bf8865" style="--skin:#bf8865" aria-label="Tan skin" aria-pressed="false"></button><button type="button" data-skin="#986747" style="--skin:#986747" aria-label="Brown skin" aria-pressed="false"></button><button type="button" data-skin="#704b36" style="--skin:#704b36" aria-label="Deep skin" aria-pressed="false"></button><button type="button" data-skin="#513729" style="--skin:#513729" aria-label="Dark skin" aria-pressed="false"></button></div></div>
</div>
<div id="spacesuitPanel" role="tabpanel" aria-labelledby="spacesuitTab" hidden><p class="suit-copy">Make your mark on the mission. Choose a colourway or create your own.</p><div class="suit-presets" role="group" aria-label="Suit colourway"><button type="button" data-suit="#646679" data-trim="#393d50">ORIGINAL</button><button type="button" data-suit="#c9d7d8" data-trim="#314757">LUNAR</button><button type="button" data-suit="#bd6042" data-trim="#393946">MARS</button><button type="button" data-suit="#528b98" data-trim="#243848">DEEP SEA</button><button type="button" data-suit="#80679d" data-trim="#332e4a">NEBULA</button><button type="button" data-suit="#d6b366" data-trim="#484239">SOLAR</button></div><div class="field-grid suit-fields"><label>Suit colour<input id="suitColor" type="color" value="#646679"></label><label>Trim colour<input id="trimColor" type="color" value="#393d50"></label><label>Accent colour<input id="accentColor" type="color" value="#bca57a"></label></div></div>
<div class="custom-small-actions"><button id="randomCharacter" type="button">RANDOMISE</button><button id="resetCharacter" type="button">RESET</button><button id="exportCharacter" type="button">EXPORT PROFILE ↓</button></div><div id="customFeedback" role="status" aria-live="polite" class="custom-feedback"></div>
</form></div>
<div class="custom-footer"><span>ONE WANDERER. YOUR STORY.</span><button id="saveCharacter" class="save-character">SAVE WANDERER <span aria-hidden="true">↗</span></button></div>
</section>
